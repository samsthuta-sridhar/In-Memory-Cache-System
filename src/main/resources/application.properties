spring.datasource.url=jdbc:postgresql://localhost:5432/imcs_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

server.port=8080

cache.max-capacity=10
cache.ttl-ms=1800000
cache.eviction-policy=LRU

security.aes-secret=imcs1234567890ab
security.session-timeout-ms=600000
security.max-login-attempts=3
security.rate-limit-per-second=10